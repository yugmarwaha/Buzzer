stages:
  - lint
  - test
  - secret-detection

variables:
  SECRET_DETECTION_ENABLED: 'true'

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# ── Style checks ──────────────────────────────────────────────────────────────

python-lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    # Pinned so a future ruff release with new rules can't suddenly fail every MR
    - pip install "ruff==0.15.21" --quiet
  script:
    - ruff check backend/ scripts/
    - ruff format --check backend/ scripts/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

frontend-typecheck:
  stage: lint
  image: node:20
  script:
    - npm install --prefix frontend/host
    - npm install --prefix frontend/player
    - npm install --prefix frontend/admin
    - (cd frontend/host   && npx tsc --noEmit)
    - (cd frontend/player && npx tsc --noEmit)
    - (cd frontend/admin  && npx tsc --noEmit)
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ── Tests ─────────────────────────────────────────────────────────────────────

# Scoring, auth and race tests, plus the concurrency tests against a real Redis
# (tests/unit/test_real_redis.py; they are skipped without REDIS_TEST_URL).
unit-tests:
  stage: test
  image: python:3.12-slim
  services:
    - name: redis:7.0-alpine
      alias: redis
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: '1'
    REDIS_TEST_URL: redis://redis:6379/15
  before_script:
    # Same system packages as backend/Dockerfile (asyncmy, cryptography)
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc default-libmysqlclient-dev pkg-config > /dev/null
    - pip install --quiet -r backend/requirements.txt -r tests/integration/requirements.txt
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - cd tests/unit && PYTHONPATH=../../backend pytest -q -o log_cli=false

# The integration tests need the whole compose stack (they run SQL and redis-cli inside
# its containers), so they run in GitHub Actions: .github/workflows/ci.yml.

# ── Security scans ────────────────────────────────────────────────────────────

sast:
  stage: test

secret_detection:
  stage: secret-detection
