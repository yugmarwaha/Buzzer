events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # API and WebSocket traffic → FastAPI backend
        location /api/ {
            # T8: image uploads and quiz imports (backend caps: 5 MiB image, 30 MiB import,
            # 32 MiB request; docs/plans/t8-images.md §4). Nginx's default is 1 MB.
            client_max_body_size 32m;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Host React app — static files
        location /host/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /host/index.html;
        }

        # Player React app — static files
        location /player/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /player/index.html;
        }

        # Admin React app — static files
        location /admin/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /admin/index.html;
        }

        # Root redirect
        location = / {
            return 302 /player/;
        }
    }
}
