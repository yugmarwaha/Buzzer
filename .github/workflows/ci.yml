# The checks of .gitlab-ci.yml for the GitHub remote, plus the integration tests.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned so a future ruff release with new rules can't suddenly fail every PR
      - run: pip install "ruff==0.15.21" --quiet
      - run: ruff check backend/ scripts/
      - run: ruff format --check backend/ scripts/

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          for app in host player admin; do
            npm install --prefix frontend/$app
            (cd frontend/$app && npx tsc --noEmit)
          done

  unit-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.0-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      # Enables tests/unit/test_real_redis.py (skipped without it)
      REDIS_TEST_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/integration/requirements.txt
      - run: pip install --quiet -r backend/requirements.txt -r tests/integration/requirements.txt
      - run: cd tests/unit && PYTHONPATH=../../backend pytest -q -o log_cli=false

  # Full games over real sockets against the compose stack (backend, MySQL, Redis), the
  # same way the README runs them locally.
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/integration/requirements.txt
      - name: Configure the stack
        run: sh scripts/ci_stack_env.sh
      - name: Start backend, MySQL and Redis
        run: docker compose up -d --build --wait backend
      - name: Migrate and wait for the admin account
        run: sh scripts/ci_wait_ready.sh http://localhost:8000
      - run: pip install --quiet -r tests/integration/requirements.txt
      - run: cd tests/integration && pytest -q -o log_cli=false
      - name: Backend log
        if: failure()
        run: docker compose logs backend --tail 300 | grep -v -E "sqlalchemy|^backend-1  \| (SELECT|FROM|WHERE|BEGIN|COMMIT|ROLLBACK|INSERT|UPDATE| )"
